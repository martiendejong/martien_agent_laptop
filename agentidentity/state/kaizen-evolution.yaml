severity_threshold_map:
  description: 'Severity-weighted promotion thresholds (Implemented 2026-03-20). Asymmetric
    cost principle: higher severity = earlier promotion. Codifies mastermind recommendation
    from v1.0.6.'
  enabled: true
  implementation_date: '2026-03-20'
  thresholds:
    CRITICAL:
      instance_threshold: 1
      signal_types_allowed:
      - ERROR
      - FEEDBACK
      reasoning: Catastrophic downside if missed. Single instance with ERROR/FEEDBACK
        signal = immediate codification.
      examples:
      - ZERO TOLERANCE violations (DONE status, legal admissions)
      - User explicit correction of critical error
    HIGH:
      instance_threshold: 2
      signal_types_allowed:
      - ERROR
      - FEEDBACK
      - PATTERN
      reasoning: Significant asymmetric cost. Two instances sufficient for pattern
        recognition.
      examples:
      - Legal escalation timing trap (candidate-011)
      - Open question trap in adversarial communication (candidate-012)
      - Documentation-as-behavior illusion (promoted at instance 2)
    MEDIUM:
      instance_threshold: 2
      condition: asymmetric_cost OR cross_domain_applicability
      default_threshold: 3
      reasoning: 'If asymmetric cost OR cross-domain: 2 instances. Otherwise 3 instances.'
      examples:
      - 'With asymmetric cost: IP ownership disputes (candidate-010)'
      - 'Default (3 instances): Develop branch errors, package conflicts'
    LOW:
      instance_threshold: 3
      reasoning: Standard 3-instance threshold. Low consequence if missed.
      examples:
      - Technical gotchas (WiX, URL verification)
      - Workflow optimizations (worktree reallocation)
  formula: promotion_threshold = severity_threshold_map[severity] AND (instance_count
    >= threshold) AND (signal_type in allowed_types OR special_conditions_met)
  override_conditions:
  - FEEDBACK signal bypasses all thresholds (user correction = immediate value)
  - 'TOOLS category: if proven effective, immediate codification (falsifiable)'
  - 'Mastermind recommendation: can override thresholds with >= 0.9 consensus'
