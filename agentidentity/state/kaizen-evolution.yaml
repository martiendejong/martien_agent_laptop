disconfirm_signals:
  description: DISCONFIRM signal type tracking (Operationalized 2026-03-20). Tracks
    instances where expected pattern DIDN'T occur when predicted. Combats confirmation
    bias by recording negative evidence.
  enabled: true
  implementation_date: '2026-03-20'
  purpose: Prevent overgeneralization of patterns. Expected X but observed Y = disconfirming
    evidence that pattern is NOT universal.
  examples:
  - pattern_expected: Develop branch accumulates errors without CI/CD
    prediction: Client-manager develop errors should occur on other projects too
    observation: PersonalityTest, Hazina, CodeHub develop branches clean despite no
      CI/CD
    conclusion: Pattern is PROJECT-SPECIFIC (client-manager), not universal .NET pattern
    action: Do NOT promote to hard rule. Keep as candidate-006 (client-manager specific)
  - pattern_expected: WordPress automation unreliable (REST API 401, browser automation
      failures)
    prediction: All WordPress operations should prefer manual bulk actions
    observation: WebSearch WordPress posting via REST API works reliably (100+ posts)
    conclusion: Pattern is CONTEXT-SPECIFIC (martiendejong.nl app password issue),
      not universal WordPress
    action: Candidate-015 remains LOW severity, watch for more instances before generalizing
  tracking:
  - candidate_id: candidate-006
    pattern: Develop branch errors without CI/CD
    disconfirm_count: 3
    disconfirm_instances:
    - PersonalityTest
    - Hazina
    - CodeHub
    status: Pattern NOT universal - project-specific to client-manager
  - candidate_id: candidate-015
    pattern: WordPress automation failures
    disconfirm_count: 1
    disconfirm_instances:
    - WebSearch WordPress posting success
    status: Pattern context-specific - need more data
  signal_type_added: DISCONFIRM joins ERROR / SUCCESS / FEEDBACK / PATTERN / MILESTONE
  usage: When pattern predicted but NOT observed, log as DISCONFIRM signal. Prevents
    false positives and overgeneralization.
